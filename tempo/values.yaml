      maxUnavailable: 1
  podDisruptionBudget:
    enabled: true
  maxUnavailable: 1
  minReadySeconds: 10
  nodeSelector: {}
  tolerations: []
  extraVolumeMounts: []
  extraVolumes: []
  config:
    log_received_traces: null
    log_received_spans:
      enabled: false
      include_all_attributes: false
      filter_by_status_error: false
    log_discarded_spans:
      enabled: false
      include_all_attributes: false
      filter_by_status_error: false
    extend_writes: null
    max_attribute_bytes: 0
    cost_attribution:
      enabled: false
      max_cardinality: 10000
      stale_duration: 15m0s
  appProtocol:
    grpc: null

compactor:
  replicas: 1
  annotations: {}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    hpa:
      enabled: false
      behavior: {}
      targetCPUUtilizationPercentage: 100
      targetMemoryUtilizationPercentage:
    keda:
      enabled: false
      triggers: []

  hostAliases: []
  image:
    registry: null
    pullSecrets: []
    repository: null
    tag: null
  priorityClassName: null
  podLabels: {}
  podAnnotations: {}
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              {{- include "tempo.selectorLabels" (dict "ctx" . "component" "compactor") | nindent 10 }}
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "tempo.selectorLabels" (dict "ctx" . "component" "compactor") | nindent 12 }}
            topologyKey: topology.kubernetes.io/zone
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  initContainers: []
  extraContainers: []
  resources: {}
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    enabled: true
  maxUnavailable: 1
  minReadySeconds: 10
  nodeSelector: {}
  tolerations: []
  extraVolumeMounts: []
  extraVolumes: []
  config:
    compaction:
      block_retention: 48h
      compacted_block_retention: 1h
      compaction_window: 1h
      v2_in_buffer_bytes: 5242880
      v2_out_buffer_bytes: 20971520
      max_compaction_objects: 6000000
      max_block_bytes: 107374182400
      retention_concurrency: 10
      v2_prefetch_traces_count: 1000
      max_time_per_tenant: 5m
      compaction_cycle: 30s
  service:
    annotations: {}
  dnsConfigOverides:
    enabled: false
    dnsConfig:
      options:
        - name: ndots

