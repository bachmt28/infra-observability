## Custom values.yaml for Telegraf -> OpenTelemetry
replicaCount: 1

image:
  repo: "docker.io/library/telegraf"
  tag: "1.38-alpine"
  pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
args: []
initContainers: []

env:
  - name: HOSTNAME
    value: "telegraf.app-otel"

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 200m

nodeSelector: {}
affinity: {}
tolerations: []
updateStrategy: {}

service:
  enabled: true
  type: LoadBalancer
  annotations: {}

rbac:
  create: true
  clusterWide: false
  rules: []

serviceAccount:
  create: true
  name:
  annotations: {}

## Telegraf config
config:
  agent:
    interval: "10s"
    round_interval: true
    metric_batch_size: 1000
    metric_buffer_limit: 10000
    collection_jitter: "0s"
    flush_interval: "10s"
    flush_jitter: "0s"
    precision: ""
    debug: true                          # bật debug để mày thấy log rõ
    quiet: false
    logfile: ""
    hostname: "$HOSTNAME"
    omit_hostname: false

  processors:
    - starlark:
        order: 1
        source: |
            # Mô hình thống nhất:
            #   metric name = nhóm njmon + suffix đơn vị (vd njmon.cpu.logicals.percent)
            #   tag instance (cpu, disk, lv, ...) + tag field (user, kbwrites, ...)
            # Khớp deploy/centralized-ml-demo/hub/configs/njmon.yaml

            def _hostname(metric):
                h = metric.tags.get("identity_hostname")
                if not h:
                    h = metric.fields.get("identity_hostname")
                if not h:
                    h = metric.tags.get("server_lpar_number_name")
                if not h:
                    h = metric.tags.get("host")
                if h and "," in h:
                    parts = h.split(",")
                    h = parts[1] if len(parts) > 1 else parts[0]
                if not h:
                    h = "unknown_nmon_node"
                return h

            # OTLP/Netdata: một metric.name = một unit → thêm suffix theo field (toàn bộ nhóm njmon)
            def _unit_class(field):
                f = field
                fl = field.lower()
                if fl.startswith("load_avg"):
                    return "load"
                if fl in ["days", "hours", "minutes"]:
                    return "count"
                if fl in ["users", "snapshot_loop", "snapshot_maxloops"]:
                    return "count"
                if "mhz" in fl or fl in ["nominal_mhz", "current_mhz", "processormhz", "bitrate_mbit"]:
                    return "mhz"
                if fl in ["elapsed", "epoch_seconds", "epoch_nanoseconds", "snapshot_seconds", "execute_time", "sleeping", "sleep_overrun"] or "epoch" in fl:
                    return "seconds"
                if fl in ["user", "sys", "wait", "idle", "busy", "puser", "psys", "pwait", "pidle"]:
                    return "percent"
                if "_pct" in fl or "percent" in fl or fl.endswith("_pct") or fl in ["entitlement_pct", "freq_pct", "physical_busy", "physical_consumed", "used_percent", "inode_percent", "mb_used", "active"]:
                    return "percent"
                if fl in ["value", "variedstate", "state"] or fl.endswith("_capable") or fl.endswith("_enabled") or "flags" in fl:
                    return "status"
                if fl in ["mirror_policy", "mirror_write_consistency", "write_verify", "open_close", "logical_partitions", "mirrors"] or fl.startswith("dumplv_"):
                    return "status"
                if fl in ["kbreads", "kbwrites", "read_mbps", "write_mbps", "read_kb", "write_kb", "xrate_read"] or "mbps" in fl or fl.endswith("_blks"):
                    return "kibps"
                if fl.endswith("_bytes") or fl in ["ibytes", "obytes", "inputbytes", "outputbytes", "rxwords", "txwords"]:
                    return "bytes"
                if fl in ["pageins", "pageouts", "pgins", "pgouts", "pgsteals", "pgspins", "pgspouts", "cpgins", "cpgouts", "scans", "zerofills", "exfills"]:
                    return "pagesps"
                if fl.endswith("_packets") or fl.endswith("_errors") or fl.endswith("_interrupts") or fl.startswith("rx_") or fl.startswith("tx_") or fl in ["collisions", "xmitdrops", "if_arpdrops", "if_iqdrops"]:
                    return "eventsps"
                if fl == "iocnt" or fl.endswith("iocnt") or fl.endswith("calls") or fl.endswith("requests") or "syscall" in fl or fl in ["xfers", "transfers", "rtransfers", "wtransfers", "bread", "bwrite", "iget", "namei"]:
                    return "opsps"
                if fl.endswith("_mb") or fl.endswith("mem") or fl in ["size", "free", "lp_size", "pgsp_total", "pgsp_free", "memsizepgs", "true_size", "expanded_memory", "ppsize_mb", "numperm", "real_total", "real_free"]:
                    return "mib"
                if fl.endswith("_time") or fl.endswith("serv") or fl in ["time", "wq_time", "rserv", "wserv"]:
                    return "seconds"
                return "count"

            def _njmon_name(base, field):
                return base + "." + _unit_class(field)

            def _emit(metric, h, name, inst, field, val):
                m = Metric(_njmon_name(name, field))
                m.time = metric.time
                m.tags.update(metric.tags)
                m.tags["host.name"] = h
                m.tags["identity_hostname"] = h
                for k in inst:
                    m.tags[k] = inst[k]
                m.tags["field"] = field
                m.fields["gauge"] = float(val)
                return m

            def _emit_static(metric, h, name, field, val):
                return _emit(metric, h, name, {}, field, val)

            def _cpu_per_core(metric, h, key, prefix, metric_name):
                if not key.startswith(prefix):
                    return None
                sub = key[len(prefix):]
                parts = sub.split("_", 1)
                if len(parts) != 2:
                    return None
                return _emit(metric, h, metric_name, {"cpu": parts[0]}, parts[1], metric.fields[key])

            def _instance_field(metric, h, key, prefix, metric_name, inst_key):
                if not key.startswith(prefix):
                    return None
                sub = key[len(prefix):]
                parts = sub.split("_", 1)
                if len(parts) != 2:
                    return None
                return _emit(metric, h, metric_name, {inst_key: parts[0]}, parts[1], metric.fields[key])

            def _disk_paths(metric, h, key):
                prefix = "disk_paths_"
                if not key.startswith(prefix):
                    return None
                for field in ["read_blks", "write_blks", "read_mbps", "write_mbps"]:
                    suf = "_" + field
                    if not key.endswith(suf):
                        continue
                    body = key[len(prefix):-len(suf)]
                    i = body.find("_Path")
                    if i < 0:
                        return None
                    disk = body[:i]
                    tail = body[i + 1:]
                    pp = tail.split("_", 1)
                    if len(pp) != 2:
                        return None
                    return _emit(metric, h, "njmon.disk.paths", {"disk": disk, "path": pp[0], "adapter": pp[1]}, field, metric.fields[key])
                return None

            def _disk_pathstatus(metric, h, key):
                prefix = "disk_pathstatus_"
                if not key.startswith(prefix):
                    return None
                for field in ["value"]:
                    suf = "_" + field
                    if not key.endswith(suf):
                        continue
                    mid = key[len(prefix):-len(suf)]
                    for sep in ["_fscsi", "_fcs"]:
                        pos = mid.find(sep)
                        if pos > 0:
                            disk = mid[:pos]
                            adapter = mid[pos + 1:]
                            return _emit(metric, h, "njmon.disk.pathstatus", {"disk": disk, "adapter": adapter}, field, metric.fields[key])
                return None

            def _filesystems(metric, h, key):
                if not key.startswith("filesystems_"):
                    return None
                suffixes = ["_f_bfree", "_f_blocks", "_files_free", "_files_inuse", "_free_mb", "_inode_percent", "_size_mb", "_used_percent"]
                for suf in suffixes:
                    if not key.endswith(suf):
                        continue
                    mount = key[12:-len(suf)]
                    field = suf[1:]
                    return _emit(metric, h, "njmon.filesystems", {"mount": mount}, field, metric.fields[key])
                return None

            def _memory_page(metric, h, key):
                prefix = "memory_page_"
                if not key.startswith(prefix):
                    return None
                sub = key[len(prefix):]
                parts = sub.split("_", 1)
                if len(parts) != 2:
                    return None
                return _emit(metric, h, "njmon.memory.pages", {"pagesize": parts[0]}, parts[1], metric.fields[key])

            def apply(metric):
                h = _hostname(metric)
                metric.tags["host.name"] = h
                metric.tags["identity_hostname"] = h
                out = []

                for key, val in metric.fields.items():
                    if type(val) != "float" and type(val) != "int":
                        continue

                    m = None

                    # --- CPU per-core (njmon.yaml: chart theo cpu) ---
                    for prefix, name in [
                        ("cpu_logicals_", "njmon.cpu.logicals"),
                        ("cpu_physicals_", "njmon.cpu.physicals"),
                        ("cpu_dispatch_", "njmon.cpu.dispatch"),
                        ("cpu_syscalls_", "njmon.cpu.syscalls"),
                    ]:
                        m = _cpu_per_core(metric, h, key, prefix, name)
                        if m:
                            break
                    if m:
                        out.append(m)
                        continue

                    # --- CPU / memory / kernel static (một chart, nhiều field) ---
                    static_map = [
                        ("cpu_details_", "njmon.cpu.details"),
                        ("cpu_util_", "njmon.cpu.util"),
                        ("cpu_logical_total_", "njmon.cpu.logical.total"),
                        ("cpu_physical_total_spurr_", "njmon.cpu.physical.total"),
                        ("cpu_physical_total_", "njmon.cpu.physical.total"),
                        ("memory_", "njmon.memory"),
                        ("kernel_", "njmon.kernel"),
                        ("vminfo_", "njmon.vminfo"),
                        ("disk_total_", "njmon.disk.total"),
                        ("network_total_", "njmon.network.total"),
                    ]
                    matched_static = False
                    for prefix, name in static_map:
                        if key.startswith(prefix):
                            # cpu_physical_total_ trước spurr; spurr đã xử lý riêng ở trên
                            if prefix == "cpu_physical_total_" and key.startswith("cpu_physical_total_spurr_"):
                                break
                            m = _emit_static(metric, h, name, key[len(prefix):], val)
                            matched_static = True
                            break
                    if matched_static:
                        out.append(m)
                        continue

                    # --- Disk / path / adapter ---
                    m = _disk_paths(metric, h, key)
                    if m:
                        out.append(m)
                        continue
                    m = _disk_pathstatus(metric, h, key)
                    if m:
                        out.append(m)
                        continue

                    inst_m = None
                    for prefix, name, inst_key in [
                        ("disks_", "njmon.disks", "disk"),
                        ("disk_adapters_", "njmon.disk.adapters", "adapter"),
                        ("logicalvolumes_", "njmon.logicalvolumes", "lv"),
                        ("volumegroups_", "njmon.volumegroups", "vg"),
                        ("paging_spaces_", "njmon.paging.spaces", "lv"),
                        ("network_interfaces_", "njmon.network.interfaces", "interface"),
                        ("network_adapters_", "njmon.network.adapters", "adapter"),
                        ("fc_adapters_", "njmon.fc.adapters", "adapter"),
                    ]:
                        inst_m = _instance_field(metric, h, key, prefix, name, inst_key)
                        if inst_m:
                            out.append(inst_m)
                            break
                    if inst_m:
                        continue

                    # --- netbuffers: instance = bufsize ---
                    if key.startswith("netbuffers_"):
                        sub = key[11:]
                        parts = sub.split("_", 1)
                        if len(parts) == 2:
                            out.append(_emit(metric, h, "njmon.netbuffers", {"bufsize": parts[0]}, parts[1], val))
                        continue

                    m = _filesystems(metric, h, key)
                    if m:
                        out.append(m)
                        continue

                    m = _memory_page(metric, h, key)
                    if m:
                        out.append(m)
                        continue

                    # --- Nhóm không có trong njmon.yaml: vẫn dùng instance+field ---
                    raw_prefixes = [
                        ("config_", "njmon.config"),
                        ("server_", "njmon.server"),
                        ("partition_type_", "njmon.partition_type"),
                        ("lpar_format1_", "njmon.lpar.format1"),
                        ("lpar_format2_", "njmon.lpar.format2"),
                        ("dynamic_reconfig_", "njmon.dynamic_reconfig"),
                        ("rperf_", "njmon.rperf"),
                        ("uptime_", "njmon.uptime"),
                        ("timestamp_", "njmon.timestamp"),
                        ("NFS_totals_", "njmon.nfs"),
                    ]
                    raw_matched = False
                    for prefix, name in raw_prefixes:
                        if key.startswith(prefix):
                            raw_matched = True
                            if prefix == "NFS_totals_":
                                f = key[11:]
                                role = "client" if f.startswith("client_") else ("server" if f.startswith("server_") else "other")
                                out.append(_emit(metric, h, name, {"nfs_role": role}, f, val))
                            else:
                                out.append(_emit_static(metric, h, name, key[len(prefix):], val))
                            break
                    if not raw_matched:
                        out.append(_emit_static(metric, h, "njmon.raw", key, val))

                # --- Biểu đồ chuẩn OpenTelemetry (Netdata custom_otel_mapping) ---
                user = metric.fields.get("cpu_util_user_pct")
                if user != None:
                    for state, v in [("user", user), ("system", metric.fields.get("cpu_util_kern_pct")), ("wait", metric.fields.get("cpu_util_wait_pct")), ("idle", metric.fields.get("cpu_util_idle_pct"))]:
                        if v == None:
                            continue
                        m = Metric("system.cpu.utilization")
                        m.time = metric.time
                        m.tags.update(metric.tags)
                        m.tags["host.name"] = h
                        m.tags["identity_hostname"] = h
                        m.tags["state"] = state
                        m.tags["cpu"] = "total"
                        m.fields["gauge"] = float(v)
                        out.append(m)

                return out
    - enum:
        mapping:
          fields: 
          - "status"
          - "hostname"
          dest: "status_code"
          value_mappings:
            healthy: 1
            problem: 2
            critical: 3

  outputs:
#    - file:
#        files: ["stdout"]
#        data_format: "influx"
    - opentelemetry:
        service_address: "otel-deploy-gateway-collector.app-otel.svc.cluster.local:4317"

  inputs:
    - socket_listener:
        service_address: "tcp://:8081"
        data_format: "json"
        json_query: ""
        name_override: "njmon"
        tag_keys:
          # Định danh server
          - "identity_hostname"
          - "identity_ipaddress"
          - "tags_serial_no_tag"
          - "server_lpar_number_name"
          # Định danh thành phần (nhờ Telegraf tự bóc từ key của JSON)
          - "cpu"
          - "disk"
          - "mount"
          - "device"
          - "interface"
          - "vgname"
          - "type"
        tags:
          os_platform: "aix"
          env: "dtu"
          source_metric: "telegraf"
    - socket_listener:
        service_address: "tcp://:8082"
        data_format: "json"
        json_query: ""
        name_override: "njmon"
        tag_keys:
          # Định danh server
          - "identity_hostname"
          - "identity_ipaddress"
          - "tags_serial_no_tag"
          - "server_lpar_number_name"
          # Định danh thành phần (nhờ Telegraf tự bóc từ key của JSON)
          - "cpu"
          - "disk"
          - "mount"
          - "device"
          - "interface"
          - "vgname"
          - "type"
        tags:
          os_platform: "aix"
          app: "t24-db"
          env: "dtu"
          source_metric: "telegraf"
    - http_listener_v2:
        service_address: ":8080"
        paths: ["/dtu-core-app-db"]
        methods: ["POST"]
        data_format: "json"
        name_override: "njmon_db"
        
        # --- ĐÂY LÀ ĐOẠN CẦN THÊM ---
        # Khai báo các trường trong JSON mà Đại ca muốn nó biến thành Label (Tag)
        tag_keys: 
          - "hostname"
          - "status"
        # ----------------------------

        tags:
          org: "example-org"
          system: "t24"
          app: "db"
          env: "dtu"
          input_type: "json"

metrics:
  health:
    enabled: false
    service_address: "http://:8888"
    threshold: 5000.0
  internal:
    enabled: true
    collect_memstats: false

pdb:
  create: true
  minAvailable: 1

